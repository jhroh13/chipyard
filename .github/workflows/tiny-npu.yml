name: TINY NPU compute RTL
on:
  workflow_dispatch:
  push:
    paths: ['tiny-npu/**', '.github/workflows/tiny-npu.yml']
  pull_request:
    paths: ['tiny-npu/**', '.github/workflows/tiny-npu.yml']
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: tiny-npu/toolchain.yaml
          activate-environment: tiny-npu
      - name: Model, SRAM and compute regression
        shell: bash -el {0}
        run: |
          cd tiny-npu
          make check-revb
          make verify-environment
          python verification/run_rtl_trace.py --latencies 16
          make numeric-prototype
          make test-fma-pipe
          python verification/test_l0_boot_rtl.py --synthetic-image
          make test-bank-hash
          make test-bank-fabric
          make model
          make sram
          make test
          make extended EXT_ARRAYS="1 2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-npu-compute-results
          path: |
            tiny-npu/architecture/v2/environment_tests.json
            tiny-npu/architecture/v2/rtl_trace_tests.json
            tiny-npu/architecture/v2/lq16*_tests.json
            tiny-npu/architecture/v2/bank*_tests.json
            tiny-npu/architecture/v2/config_tests.json
            tiny-npu/generated-revb/**/manifest.json
            tiny-npu/generated-revb/**/lint.log
            tiny-npu/build/**/summary.json
            tiny-npu/build/**/simulation.log
            tiny-npu/build/**/compile.log

  fma-gate-depth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned generic synthesis tools
        run: python -m pip install --target tiny-npu/build/synth-tools -r tiny-npu/synthesis/requirements.txt
      - name: Enforce 40 basic gates per register stage
        run: |
          make -C tiny-npu check-fma-depth
          make -C tiny-npu test-fma-netlist
          make -C tiny-npu check-boot-depth
          python tiny-npu/tools/install_sv2v.py
          make -C tiny-npu check-bank-depth
          make -C tiny-npu test-bank-netlist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-npu-fma-gate-depth
          path: |
            tiny-npu/architecture/v2/fma_gate_depth.json
            tiny-npu/architecture/v2/fma_netlist_tests.json
            tiny-npu/architecture/v2/preloaded_boot_gate_depth.json
            tiny-npu/architecture/v2/bank_fabric_gate_depth.json
            tiny-npu/architecture/v2/bank_netlist_tests.json
            tiny-npu/build/bank-depth-*/synth.log
            tiny-npu/architecture/v2/l0_boot_gate_depth.json
            tiny-npu/build/boot-guard-depth-*/synth.log
            tiny-npu/build/synthesis-pipe/**/depth.json
            tiny-npu/build/synthesis-pipe/**/synth.log
